<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Jev</title>
  <desc id="desc">A research collection of Jev-style decision models. State and questions produce Choice, Score, and Noul outputs.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c32"/><stop offset="1" stop-color="#17363f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2dd4bf" stop-opacity=".12"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="240" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <ellipse cx="1040" cy="115" rx="340" ry="210" fill="url(#glow)"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="42" y="50" width="198" height="24" rx="12" fill="#183e47" stroke="#35716e"/>
    <text x="141" y="66" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#99f6e4">RESEARCH COLLECTION</text>
    <text x="40" y="132" font-size="64" font-weight="700" letter-spacing="-1.8" fill="#f8fafc">Awesome <tspan fill="#5eead4">Jev</tspan></text>
    <text x="43" y="177" font-size="11" letter-spacing="1.5" fill="#9bb4ca">FOUNDATIONS  /  ARCHITECTURES  /  APPLICATIONS</text>

    <g transform="translate(624,28)">
      <rect width="168" height="184" rx="14" fill="#192f44" stroke="#36566a"/>
      <text x="84" y="40" text-anchor="middle" font-size="24" font-weight="650" fill="#f8fafc">Choice</text>
      <g fill="#2d4b5d">
        <rect x="24" y="72" width="120" height="12" rx="5"/>
        <rect x="24" y="98" width="120" height="12" rx="5"/>
        <rect x="24" y="124" width="120" height="12" rx="5"/>
      </g>
      <g fill="#5eead4">
        <rect x="24" y="72" width="72" height="12" rx="5"/>
        <rect x="24" y="98" width="36" height="12" rx="5"/>
        <rect x="24" y="124" width="12" height="12" rx="5"/>
      </g>
      <text x="84" y="168" text-anchor="middle" font-size="11" fill="#a8bdd0">Candidate probabilities</text>
    </g>

    <g transform="translate(808,28)">
      <rect width="168" height="184" rx="14" fill="#192f44" stroke="#36566a"/>
      <text x="84" y="40" text-anchor="middle" font-size="24" font-weight="650" fill="#f8fafc">Score</text>
      <path d="M28 138H140" stroke="#456579"/>
      <g fill="#93c5fd">
        <rect x="30" y="114" width="14" height="24" rx="3"/>
        <rect x="53" y="94" width="14" height="44" rx="3"/>
        <rect x="76" y="74" width="14" height="64" rx="3"/>
        <rect x="99" y="100" width="14" height="38" rx="3"/>
        <rect x="122" y="118" width="14" height="20" rx="3"/>
      </g>
      <text x="84" y="168" text-anchor="middle" font-size="11" fill="#a8bdd0">Ordered rating levels</text>
    </g>

    <g transform="translate(992,28)">
      <rect width="168" height="184" rx="14" fill="#192f44" stroke="#36566a"/>
      <text x="84" y="40" text-anchor="middle" font-size="24" font-weight="650" fill="#f8fafc">Noul</text>
      <circle cx="84" cy="108" r="28" fill="none" stroke="#314f63" stroke-width="7"/>
      <circle cx="84" cy="108" r="28" pathLength="100" fill="none" stroke="#fcd34d" stroke-width="7" stroke-dasharray="80 20" stroke-linecap="round" transform="rotate(-90 84 108)"/>
      <text x="84" y="112.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fef3c7">P(true)</text>
      <text x="84" y="168" text-anchor="middle" font-size="11" fill="#a8bdd0">Boolean event probability</text>
    </g>
  </g>
</svg>
